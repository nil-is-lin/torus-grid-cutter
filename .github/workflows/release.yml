name: Release

# 触发：推送 v* 标签，或手动在 Actions 页点 Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（默认 v0.1.0）'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write   # 需要创建 Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (wgpu/egui GUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev libxrandr-dev libxi-dev libvulkan-dev

      - name: Build release binary
        run: cargo build --release --verbose

      - name: List build output (diagnostics)
        shell: bash
        continue-on-error: true
        run: |
          echo "=== target/release (all files) ==="
          ls -la target/release 2>/dev/null || echo "target/release: missing"
          echo "=== target/release/deps (executable-like files only) ==="
          for f in target/release/deps/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.d|*.rlib|*.rmeta|*.json|*.o) continue ;;
            esac
            echo "$f"
          done | sort -u

      - name: Locate and rename artifact
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          BIN=""
          echo "scanning target/release and target/release/deps for executable artifacts ..."
          for dir in target/release target/release/deps; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              ext="${base##*.}"
              # skip dependency artifacts
              case "$ext" in
                d|rlib|rmeta|json|o|dll|pdb|lib|exp) continue ;;
              esac
              # on Windows runner accept .exe; on Unix accept executable bit
              if [ "$ext" = "exe" ] || [ -x "$f" ]; then
                echo "  candidate: $f"
                BIN="$f"
              fi
            done
          done
          if [ -z "$BIN" ]; then
            echo "!! no executable artifact found"
            echo "for reference, target/release contents:"
            ls -la target/release 2>/dev/null
            echo "for reference, target/release/deps contents:"
            ls -la target/release/deps 2>/dev/null | head -40
            exit 1
          fi
          echo "found: $BIN"
          case "${{ runner.os }}" in
            Windows) mv "$BIN" torus_grid_cutter-windows.exe ;;
            Linux)   mv "$BIN" torus_grid_cutter-linux ;;
            macOS)   mv "$BIN" torus_grid_cutter-macos ;;
          esac
          echo "=== renamed artifacts ==="
          ls -la torus_grid_cutter-* 2>/dev/null || { echo "!! no artifact produced"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torus-grid-cutter-${{ matrix.os }}
          path: torus_grid_cutter-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Gather release assets
        run: |
          mkdir -p assets
          cp artifacts/torus_grid_cutter-* assets/ 2>/dev/null || true
          cp doc/*.pdf assets/
          ls -lh assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入值；tag 推送时自动用 tag 名
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: torus-grid-cutter ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: assets/*
          # 演示视频 demo.mp4 不进仓库，请在本 Release 页面手动拖入附件，
          # 或在仓库里提交 demo.mp4 后把上面 files 改为 includes assets/* 与 demo.mp4。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
